# Track 0 CI.  Two jobs:
#   tests     -- every push and PR.  Fast.
#   boundary  -- manual trigger only (Actions tab -> "Track 0" -> Run workflow).
#                Runs the grid-chosen bank in boundary.py on a runner nobody has
#                a hand on and commits results/ back, so the numbers in the
#                ledger trace to a commit hash.  Slow: 2 cores, allow ~2 hours.
name: Track 0

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      budget:
        description: node budget per search
        default: "400000"
      closures:
        description: comma-separated closure values
        default: "1,2,3"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python test_track0.py

  boundary:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the bank
        run: |
          python boundary.py --budget ${{ inputs.budget }} --closures ${{ inputs.closures }} \
            --out results/boundary-ci-${{ inputs.budget }}-${{ github.sha }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: boundary-results
          path: results/
      - name: Commit results back
        run: |
          git config user.name "track0-ci"
          git config user.email "track0-ci@users.noreply.github.com"
          git add results/
          git commit -m "results: boundary bank, budget ${{ inputs.budget }}, closures ${{ inputs.closures }}, from ${{ github.sha }}" || exit 0
          git push
